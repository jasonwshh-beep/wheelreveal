<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partnership Reveal Wheel</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#010817;font-family:Arial,sans-serif}body{position:relative;isolation:isolate}
.scene{position:absolute;inset:0;background:linear-gradient(rgba(0,12,35,.28),rgba(0,9,28,.42)),url('/reveal-source.png') center/cover no-repeat;filter:saturate(1.08) contrast(1.05);z-index:-5}
.wheel-mask{position:absolute;left:50%;top:50%;width:min(69vw,900px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#021128 0 60%,#03132d 72%,rgba(2,12,29,.94) 80%,transparent 81%);box-shadow:0 0 90px 35px rgba(0,30,80,.78);z-index:-1}
.wheel-stage{position:absolute;left:50%;top:50%;width:min(62vw,800px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 0 18px #00aaff) drop-shadow(0 0 50px rgba(0,95,255,.8))}
.spinner{position:absolute;inset:4.5%;border-radius:50%;animation:spin 42s linear infinite;will-change:transform;background:conic-gradient(from -30deg,#c20d23 0 60deg,#c89205 60deg 120deg,#121722 120deg 180deg,#08a35c 180deg 240deg,#7131d2 240deg 300deg,#0756bd 300deg 360deg);border:8px solid #063979;box-shadow:inset 0 0 28px rgba(255,255,255,.25),inset 0 0 70px rgba(0,12,44,.65),0 0 0 13px #041934,0 0 0 20px #13b7ff,0 0 38px #008cff}
.spinner:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.32) 0 .65deg,transparent .65deg 60deg);pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;left:50%;top:50%;width:28%;height:16%;margin:-8% 0 0 -14%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:clamp(16px,2vw,31px);font-weight:900;text-shadow:0 2px 7px #000,0 0 12px currentColor;transform:rotate(var(--a)) translateY(-183%) rotate(90deg);white-space:nowrap}.label small{font-size:.44em;margin-top:3px}.label .mark{font-size:1.35em;line-height:.7}.roobet{color:#ffd22a}.stake,.rainbet{font-family:Georgia,serif;font-style:italic}.gamdom{color:#52ffc0}.shuffle{color:#ead9ff}
.hub{position:absolute;left:50%;top:50%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 42% 34%,#087aff,#031439 62%,#00b6ff 66%,#03142e 72%);border:5px solid #5bd6ff;box-shadow:0 0 20px #00a9ff,inset 0 0 22px #008cff;display:grid;place-items:center;color:#fff;font-size:clamp(38px,5.5vw,76px);font-weight:1000;font-style:italic;text-shadow:0 0 14px #00aaff;z-index:3}
.rim{position:absolute;inset:0;border-radius:50%;border:12px solid #061733;box-shadow:inset 0 0 0 5px #27c8ff,inset 0 0 35px #008cff,0 0 0 4px #0875cc,0 0 35px #00aaff;pointer-events:none}
.pointer{position:absolute;left:50%;top:-5%;transform:translateX(-50%);width:11%;height:15%;z-index:8;filter:drop-shadow(0 0 10px #00baff) drop-shadow(0 0 24px #087cff)}.pointer:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#eaffff,#119cff 62%,#043878);clip-path:polygon(50% 100%,0 0,100% 0)}.pointer:after{content:"";position:absolute;inset:14% 19% 23%;background:#056fe1;clip-path:polygon(50% 100%,0 0,100% 0)}
.energy{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 27%,rgba(0,151,255,.1) 48%,transparent 68%),repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 10deg,rgba(0,188,255,.07) 11deg 12deg,transparent 13deg 26deg);animation:pulse 3.2s ease-in-out infinite alternate;mix-blend-mode:screen;z-index:1}@keyframes pulse{to{opacity:.55;transform:scale(1.025)}}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}@media(max-aspect-ratio:4/3){.wheel-stage{width:min(78vw,760px)}.wheel-mask{width:min(86vw,850px)}}
</style></head><body><div class="scene"></div><div class="wheel-mask"></div><div class="energy"></div><div class="wheel-stage"><div class="spinner"><div class="label thrill" style="--a:0deg"><span class="mark">⚡</span><span>thrill.com</span></div><div class="label roobet" style="--a:60deg"><span class="mark">◎</span><span>roobet.com</span></div><div class="label stake" style="--a:120deg"><span>Stake</span><small>.com</small></div><div class="label gamdom" style="--a:180deg"><span class="mark">◆</span><span>gamdom</span><small>.com</small></div><div class="label shuffle" style="--a:240deg"><span class="mark">S</span><span>shuffle</span><small>.com</small></div><div class="label rainbet" style="--a:300deg"><span>Rainbet</span><small>.com</small></div><div class="hub">W</div></div><div class="rim"></div><div class="pointer"></div></div><canvas id="fx"></canvas>
<script>(()=>{const c=document.getElementById('fx'),x=c.getContext('2d');let w,h,p=[];function size(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);p=Array.from({length:Math.max(45,Math.floor(w*h/22000))},()=>({x:Math.random()*w,y:Math.random()*h,r:.4+Math.random()*2,v:-.15-Math.random()*.45,a:.15+Math.random()*.7,q:Math.random()*6.28}))}function draw(t){x.clearRect(0,0,w,h);for(const o of p){o.y+=o.v;o.x+=Math.sin(t*.0007+o.q)*.12;if(o.y<-5){o.y=h+5;o.x=Math.random()*w}x.beginPath();x.fillStyle=`rgba(62,196,255,${o.a*(.65+.35*Math.sin(t*.002+o.q))})`;x.shadowBlur=12;x.shadowColor='#009dff';x.arc(o.x,o.y,o.r,0,6.283);x.fill()}requestAnimationFrame(draw)}addEventListener('resize',size);size();requestAnimationFrame(draw)})();</script></body></html>
