<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partnership Reveal</title>
<style>
  :root {
    --blue: #0788ff;
    --blue2: #00c8ff;
    --white: #f5fbff;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #020812;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    position: relative;
    isolation: isolate;
  }

  /* Original generated scene */
  .scene {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(0,10,25,.18), rgba(0,10,25,.35)),
      url("/reveal-source.png") center center / cover no-repeat;
    filter: saturate(1.05) contrast(1.05);
    z-index: -5;
  }

  /* Hide the source wheel underneath the animated wheel */
  .wheel-hole {
    position: absolute;
    width: min(61vw, 790px);
    height: min(61vw, 790px);
    left: 50%;
    top: 51%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(2,9,19,.98) 0 58%, rgba(2,9,19,.88) 68%, rgba(2,9,19,.20) 77%, transparent 80%);
    box-shadow: 0 0 80px rgba(0,150,255,.25);
    z-index: -2;
  }

  /* The wheel uses the generated scene as its source, clipped to a circle. */
  .wheel-wrap {
    position: absolute;
    width: min(60vw, 780px);
    height: min(60vw, 780px);
    left: 50%;
    top: 51%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    overflow: hidden;
    z-index: 2;
    filter: drop-shadow(0 0 18px rgba(0,160,255,.95))
            drop-shadow(0 0 45px rgba(0,80,255,.55));
  }

  .wheel {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    animation: slowSpin 42s linear infinite;
    will-change: transform;
  }

  @keyframes slowSpin {
    from { transform: rotate(0deg) scale(1.035); }
    to   { transform: rotate(360deg) scale(1.035); }
  }

  .rim {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid rgba(70,190,255,.9);
    box-shadow:
      inset 0 0 24px rgba(0,180,255,.9),
      inset 0 0 65px rgba(0,60,255,.5),
      0 0 22px rgba(0,170,255,.9);
    pointer-events: none;
  }

  .pointer {
    position: absolute;
    left: 50%;
    top: calc(51% - min(31vw, 395px));
    transform: translate(-50%, -8%);
    width: 0;
    height: 0;
    border-left: 27px solid transparent;
    border-right: 27px solid transparent;
    border-top: 58px solid #fff;
    filter: drop-shadow(0 0 8px #00aaff) drop-shadow(0 0 22px #0077ff);
    z-index: 5;
  }

  .pointer::after {
    content: "";
    position: absolute;
    left: -14px;
    top: -52px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #0a78ff;
    box-shadow: 0 0 18px #00b7ff;
  }

  /* Reactive energy */
  .energy {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 51%, transparent 30%, rgba(0,137,255,.07) 48%, transparent 67%),
      repeating-conic-gradient(from 0deg at 50% 51%,
        transparent 0deg 8deg,
        rgba(0,173,255,.08) 9deg 10deg,
        transparent 11deg 25deg);
    animation: energyPulse 3.2s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }

  @keyframes energyPulse {
    from { opacity: .35; transform: scale(1); }
    to   { opacity: .9; transform: scale(1.025); }
  }

  .flash {
    position: absolute;
    inset: -20%;
    background: radial-gradient(circle at 50% 50%, rgba(0,180,255,.20), transparent 45%);
    animation: flash 2.7s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes flash {
    0%, 100% { opacity: .15; }
    48% { opacity: .65; }
    52% { opacity: .18; }
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* Subtle reveal-state HUD, easy to remove */
  .top-line {
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.88);
    font-size: clamp(11px, 1.1vw, 17px);
    font-weight: 800;
    letter-spacing: .34em;
    text-transform: uppercase;
    text-shadow: 0 0 12px #008cff;
    z-index: 6;
    white-space: nowrap;
  }

  .status {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 16px;
    border: 1px solid rgba(0,180,255,.55);
    border-radius: 999px;
    color: rgba(225,247,255,.9);
    background: rgba(0,12,28,.42);
    backdrop-filter: blur(8px);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    z-index: 6;
    box-shadow: 0 0 20px rgba(0,140,255,.22);
  }

  /* OBS-friendly: hide HUD by adding ?clean=1 */
  body.clean .top-line,
  body.clean .status { display: none; }

  @media (max-aspect-ratio: 4/3) {
    .wheel-wrap, .wheel-hole {
      width: min(72vw, 720px);
      height: min(72vw, 720px);
    }
    .pointer { top: calc(51% - min(36vw, 360px)); }
  }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="wheel-hole"></div>
  <div class="flash"></div>
  <div class="energy"></div>

  <div class="wheel-wrap">
    <img class="wheel" src="/reveal-source.png" alt="">
    <div class="rim"></div>
  </div>

  <div class="pointer"></div>
  <canvas id="fx"></canvas>

  <div class="top-line">BIG PARTNERSHIP REVEAL</div>
  <div class="status">WHO WILL IT BE?</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("clean") === "1") document.body.classList.add("clean");

  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  let dpr = Math.min(devicePixelRatio || 1, 2);
  let particles = [];
  let w = 0, h = 0;

  function resize() {
    w = innerWidth; h = innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    particles = Array.from({length: Math.max(55, Math.floor(w*h/17000))}, () => ({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*2.2+.4,
      vx: (Math.random()-.5)*.25,
      vy: -.15-Math.random()*.55,
      a: Math.random()*.8+.15,
      phase: Math.random()*Math.PI*2
    }));
  }

  function frame(t) {
    ctx.clearRect(0,0,w,h);

    // Floating electric particles
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.phase += .025;
      if (p.y < -10) { p.y = h+10; p.x = Math.random()*w; }
      if (p.x < -10) p.x = w+10;
      if (p.x > w+10) p.x = -10;

      const alpha = p.a * (.55 + .45*Math.sin(p.phase));
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(70,190,255,${alpha})`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = "rgba(0,150,255,.9)";
      ctx.fill();
    }

    // Fast radial streaks behind the wheel
    const cx = w/2, cy = h*.51;
    ctx.save();
    ctx.translate(cx,cy);
    for (let i=0;i<14;i++) {
      const a = (i/14)*Math.PI*2 + t/9000;
      const len = 90 + ((Math.sin(t/600+i*2)+1)/2)*170;
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(Math.min(w,h)*.28,0);
      ctx.lineTo(Math.min(w,h)*.28+len,0);
      ctx.strokeStyle = "rgba(50,180,255,.10)";
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8;
      ctx.shadowColor = "rgba(0,130,255,.8)";
      ctx.stroke();
      ctx.rotate(-a);
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
